groups:
  - name: todo-app-alerts
    rules:
      # Alert if error rate exceeds 5%
      - alert: HighErrorRate
        expr: |
          sum(rate(app_request_count_total{status=~"5.."}[5m]))
          /
          sum(rate(app_request_count_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ humanizePercentage $value }} over the last 5 minutes."

      # Alert if p95 latency exceeds 500ms
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(app_request_latency_seconds_bucket[5m])) by (le, endpoint)
          ) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High latency on {{ $labels.endpoint }}"
          description: "p95 latency is {{ humanizeDuration $value }}."

      # Alert if app is down
      - alert: AppDown
        expr: up{job="todo-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Todo app is down"
          description: "The todo-app target has been unreachable for 1 minute."
